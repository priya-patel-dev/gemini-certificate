  function draw() {
    canvas.width = bgImage.width;
    canvas.height = bgImage.height;
    ctx.drawImage(bgImage, 0, 0);

    const name = nameInput.value.trim() || "Your Name Here";

    // Positioned on the blank line above "Actively participated in..."
    const fontSize = Math.round(canvas.width * 0.028);
    ctx.font = "italic bold " + fontSize + "px Georgia, serif";
    ctx.fillStyle = "#1a1a1a";
    ctx.textAlign = "center";
    ctx.fillText(name, canvas.width / 2, canvas.height * 0.505);
  }

  bgImage.onload = draw;
  nameInput.addEventListener('input', draw);

  downloadBtn.addEventListener('click', function() {
    const name = nameInput.value.trim() || "certificate";
    const link = document.createElement('a');
    link.download = name.replace(/\s+/g, '_') + '_certificate.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
